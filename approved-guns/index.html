<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Approved Gun Pack v1 List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}:root{--red:#bb0000;--hot:#f01818;--rose:#d5a0a9;--ice:#e9f8ff;--line:rgba(255,255,255,.08);--heading:"Oswald",sans-serif;--body:"Inter",sans-serif}
    html,body{min-height:100%}body{margin:0;color:#ddd;font-family:var(--body);background:radial-gradient(circle at 50% -12%,rgba(255,255,255,.105),transparent 22rem),radial-gradient(circle at 85% 8%,rgba(187,0,0,.12),transparent 24rem),linear-gradient(180deg,#080808,#020202)}
    main{width:min(1320px,calc(100% - 2rem));margin:auto;padding:clamp(2.5rem,6vw,5rem) 0}header{margin-bottom:2rem;text-align:center}.eyebrow{color:var(--hot);font-size:.68rem;font-weight:900;letter-spacing:3px;text-transform:uppercase}
    h1{margin:.45rem 0 .65rem;color:#fff;font:700 clamp(2.4rem,7vw,5.4rem)/.92 var(--heading);letter-spacing:clamp(2px,.7vw,8px);text-transform:uppercase;text-shadow:0 0 14px rgba(240,24,24,.22),0 0 34px rgba(255,255,255,.08)}
    header p{max-width:720px;margin:0 auto;color:#9a9a9a;font-size:.92rem;line-height:1.7}.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:center;margin:1.35rem 0 0}.pill{border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.45rem .72rem;color:#d8d8d8;background:rgba(255,255,255,.035);font-size:.68rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
    .guns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}.gun{display:flex;min-height:100%;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),#090909;box-shadow:0 18px 34px rgba(0,0,0,.34)}
    .gun-inner{display:grid;grid-template-rows:auto 1fr;width:100%}.media{position:relative;display:grid;place-items:center;min-height:190px;padding:1.2rem;background:linear-gradient(135deg,rgba(187,0,0,.1),rgba(255,255,255,.025) 42%,rgba(0,0,0,.2));border-bottom:1px solid rgba(255,255,255,.07)}
    .media button{appearance:none;border:0;background:transparent;padding:0;cursor:zoom-in}.media img{display:block;width:100%;max-width:310px;height:132px;object-fit:contain;filter:drop-shadow(0 20px 22px rgba(0,0,0,.58));transition:transform .24s ease,filter .24s ease}.media button:hover img{transform:translateY(-2px) scale(1.025);filter:drop-shadow(0 22px 24px rgba(0,0,0,.66)) brightness(1.08)}
    .number{position:absolute;left:.8rem;top:.75rem;color:#ffffffb8;font:700 .72rem var(--heading);letter-spacing:.14em}.status{position:absolute;right:.75rem;top:.7rem;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:.34rem .5rem;color:#fff;background:rgba(0,0,0,.42);font-size:.56rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.status.auto{border-color:rgba(240,24,24,.44);color:#ffd7d7;background:rgba(187,0,0,.22)}
    .content{display:flex;flex-direction:column;gap:.8rem;padding:1rem}.name{margin:0;color:#fff;font:700 1.16rem/1.08 var(--heading);letter-spacing:.055em;text-transform:uppercase}.spawn{color:#858585;font-size:.62rem;font-weight:800;letter-spacing:.08em;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:.45rem}.tag{border:1px solid rgba(255,255,255,.095);border-radius:999px;padding:.32rem .48rem;color:#cfcfcf;background:#111;font-size:.58rem;font-weight:900;letter-spacing:.065em;text-transform:uppercase}.tag.rose{border-color:rgba(213,160,169,.34);color:#ffdce2;background:rgba(213,160,169,.09)}.tag.auto{border-color:rgba(240,24,24,.34);color:#ffbaba;background:rgba(187,0,0,.12)}
    .attachments{display:flex;flex-wrap:wrap;gap:.42rem;margin-top:auto}.attachment{border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:.4rem .48rem;color:#d9d9d9;background:rgba(255,255,255,.028);font-size:.68rem;font-weight:750}.attachment.none{color:#888}.lightbox{width:100vw;max-width:none;height:100vh;max-height:none;margin:0;padding:0;border:0;background:rgba(0,0,0,.96)}.lightbox::backdrop{background:#000f}.lightbox img{width:100%;height:100%;object-fit:contain}.close{position:fixed;right:16px;top:16px;z-index:2;width:44px;height:44px;cursor:pointer;border:1px solid rgba(240,24,24,.35);border-radius:8px;color:#fff;background:#111e;font-size:1.6rem}
    @media(max-width:980px){.guns{grid-template-columns:repeat(2,minmax(0,1fr))}.media{min-height:176px}}@media(max-width:620px){main{width:min(100% - 1rem,1320px);padding:2rem 0}.guns{grid-template-columns:1fr}.media{min-height:166px}.content{padding:.9rem}.name{font-size:1.06rem}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Brick City Roleplay</div>
      <h1>Approved Gun List</h1>
      <p>Approved weapons from the Bank$on Gun Pack v1, with matching inventory images, attachment labels, and full-auto status.</p>
      <div class="toolbar" aria-label="List summary">
        <span class="pill">25 Gun Pack Weapons</span>
        <span class="pill">Inventory Images</span>
        <span class="pill">Attachment Ready</span>
      </div>
    </header>
    <section class="guns" id="guns" aria-label="Approved Gun Pack v1 weapons"></section>
  </main>
  <dialog class="lightbox" id="lightbox">
    <button class="close" id="close" type="button" aria-label="Close image">&times;</button>
    <img id="lightboxImage" alt="">
  </dialog>
  <script>
    const weapons=[
      {name:"Bape Scorpion Evo",spawn:"WEAPON_BAPEEVO",image:"WEAPON_BAPEEVO.png",type:"SMG",auto:true,attachments:["Heavy Suppressor","Extended SMG Mag"]},
      {name:"Black AK-109",spawn:"WEAPON_BLACKAK",image:"WEAPON_BLACKAK.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor"]},
      {name:"Bloody Famas",spawn:"WEAPON_BLOODYFAMAS",image:"WEAPON_BLOODYFAMAS.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Medium Scope","Extended Rifle Mag"]},
      {name:"Camo MP7",spawn:"WEAPON_CAMOMP7",image:"WEAPON_CAMOMP7.png",type:"SMG",auto:true,attachments:["Heavy Suppressor","Medium Scope","Extended SMG Mag"]},
      {name:"Caution MP5",spawn:"WEAPON_CAUTIONMP5",image:"WEAPON_CAUTIONMP5.png",type:"SMG",auto:true,attachments:["Heavy Suppressor","Medium Scope"]},
      {name:"Fire X12 Shotgun",spawn:"WEAPON_FIRESHOTTY",image:"WEAPON_FIRESHOTTY.png",type:"Shotgun",auto:false,attachments:["Heavy Suppressor"]},
      {name:"Ghost Glock Switch",spawn:"WEAPON_GHOSTSWITCH",image:"WEAPON_GHOSTSWITCH.png",type:"Pistol",auto:true,attachments:["Flashlight"]},
      {name:"Gold .50 Pistol",spawn:"WEAPON_GOLD50",image:"WEAPON_GOLD50.png",type:"Pistol",auto:false,attachments:[]},
      {name:"Gold AK-47",spawn:"WEAPON_GOLDAK",image:"WEAPON_GOLDAK.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Medium Scope","Extended Rifle Mag"]},
      {name:"Halloween AUG",spawn:"WEAPON_HALLOWEENAUG",image:"WEAPON_HALLOWEENAUG.png",type:"Rifle",auto:true,attachments:[]},
      {name:"Joker SCAR-H",spawn:"WEAPON_JOKERSCAR",image:"WEAPON_JOKERSCAR.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Medium Scope","Grip","Extended Rifle Mag"]},
      {name:"Opp Pack KTec PLR",spawn:"WEAPON_KTECPACK",image:"WEAPON_KTECPACK.png",type:"Rifle",auto:true,attachments:["Extended Rifle Mag"]},
      {name:"Mac-10",spawn:"WEAPON_MAC10",image:"WEAPON_MAC10.png",type:"SMG",auto:true,attachments:["Heavy Suppressor"]},
      {name:"MK-18",spawn:"WEAPON_MK18",image:"WEAPON_MK18.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor"]},
      {name:"Money SIG-556",spawn:"WEAPON_MONEYSIG",image:"WEAPON_MONEYSIG.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Extended Rifle Mag"]},
      {name:"Pow! ACR",spawn:"WEAPON_POWACR",image:"WEAPON_POWACR.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor"]},
      {name:"Red FN-509",spawn:"WEAPON_REDFN",image:"WEAPON_REDFN.png",type:"Pistol",auto:false,attachments:["Extended Pistol Mag"]},
      {name:"Serpent Honeybadger Glowing",spawn:"WEAPON_SERPENTBADGER",image:"WEAPON_SERPENTBADGER.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Medium Scope","Flashlight","Extended Rifle Mag"]},
      {name:"Slimey Draco",spawn:"WEAPON_SLIMEYDRACO",image:"WEAPON_SLIMEYDRACO.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Extended Rifle Mag"]},
      {name:"Snow Tec-9",spawn:"WEAPON_SNOWTEC",image:"WEAPON_SNOWTEC.png",type:"SMG",auto:true,attachments:["Heavy Suppressor","Extended Pistol Mag"]},
      {name:"Supreme P90",spawn:"WEAPON_SUPREMEP90",image:"WEAPON_SUPREMEP90.png",type:"SMG",auto:true,attachments:["Heavy Suppressor"]},
      {name:"Blue Streak MG-249",spawn:"WEAPON_STREAKMG",image:"WEAPON_STREAKMG.png",type:"MG",auto:true,attachments:["Grip"]},
      {name:"Thunder ARP",spawn:"WEAPON_THUNDERARP",image:"WEAPON_THUNDERARP.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Medium Scope","Extended Rifle Mag"]},
      {name:"Tiger G36",spawn:"WEAPON_TIGERG36",image:"WEAPON_TIGERG36.png",type:"Rifle",auto:true,attachments:["Heavy Suppressor","Extended Rifle Mag"]},
      {name:"Wock UMP-45",spawn:"WEAPON_WOCKUMP",image:"WEAPON_WOCKUMP.png",type:"SMG",auto:true,attachments:["Heavy Suppressor","Extended SMG Mag"]}
    ];
    const guns=document.getElementById("guns");
    const lightbox=document.getElementById("lightbox");
    const image=document.getElementById("lightboxImage");
    const assetPath="../assets/guns/gpv1/";
    guns.innerHTML=weapons.map((weapon,index)=>{
      const attachmentMarkup=weapon.attachments.length?weapon.attachments.map(item=>`<span class="attachment">${item}</span>`).join(""):`<span class="attachment none">No attachments</span>`;
      return `<article class="gun">
        <div class="gun-inner">
          <div class="media">
            <span class="number">${String(index+1).padStart(2,"0")}</span>
            <span class="status ${weapon.auto?"auto":""}">${weapon.auto?"Full Auto":"Semi Auto"}</span>
            <button class="weapon-photo" type="button" data-full="${assetPath+weapon.image}" aria-label="Open ${weapon.name} image full screen">
              <img src="${assetPath+weapon.image}" alt="${weapon.name}" loading="lazy" decoding="async">
            </button>
          </div>
          <div class="content">
            <h2 class="name">${weapon.name}</h2>
            <div class="spawn">Label: ${weapon.name}</div>
            <div class="meta">
              <span class="tag">${weapon.type}</span>
              ${weapon.finish?`<span class="tag rose">${weapon.finish}</span>`:""}
              <span class="tag auto">${weapon.auto?"Fully Automatic":"Not Fully Auto"}</span>
            </div>
            <div class="attachments" aria-label="${weapon.name} attachments">${attachmentMarkup}</div>
          </div>
        </div>
      </article>`;
    }).join("");
    document.querySelectorAll(".weapon-photo").forEach(button=>button.addEventListener("click",()=>{image.src=button.dataset.full;image.alt=button.querySelector("img").alt;lightbox.showModal()}));
    document.getElementById("close").addEventListener("click",()=>{lightbox.close();image.removeAttribute("src")});
    lightbox.addEventListener("click",event=>{if(event.target===lightbox)document.getElementById("close").click()});
  </script>
</body>
</html>
