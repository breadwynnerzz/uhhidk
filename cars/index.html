  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --red: #bb0000;
      --hot: #f01818;
      --black: #050505;
      --panel: #0b0b0b;
      --panel-2: #101010;
      --line: rgba(255,255,255,.07);
      --red-line: rgba(187,0,0,.38);
      --heading: "Oswald", sans-serif;
      --body: "Inter", sans-serif;
    }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: #fff;
      font-family: var(--body);
      background:
        radial-gradient(circle at 50% -10%, rgba(187,0,0,.19), transparent 34rem),
        linear-gradient(180deg, #070707, #020202);
    }
    .desktop {
      min-height: 100vh;
      padding: clamp(.65rem, 1.5vw, 1.2rem);
    }
    .explorer {
      width: min(1580px, 100%);
      min-height: calc(100vh - clamp(1.3rem, 3vw, 2.4rem));
      margin: auto;
      overflow: hidden;
      border: 1px solid rgba(187,0,0,.28);
      border-radius: 13px;
      background: var(--black);
      box-shadow:
        0 28px 90px rgba(0,0,0,.72),
        0 0 34px rgba(187,0,0,.11),
        inset 0 1px 0 rgba(255,255,255,.025);
    }
    .titlebar {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 18px;
      border-bottom: 1px solid var(--red-line);
      background:
        linear-gradient(90deg, rgba(187,0,0,.14), transparent 28%, transparent 72%, rgba(187,0,0,.06)),
        #0a0a0a;
      box-shadow: 0 8px 28px rgba(0,0,0,.38), 0 1px 18px rgba(187,0,0,.08);
    }
    .app-mark {
      width: 35px;
      height: 35px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 6px;
      border: 1px solid rgba(230,0,0,.52);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(187,0,0,.7), #180000);
      box-shadow: 0 0 18px rgba(230,0,0,.22), inset 0 0 12px rgba(255,80,80,.08);
    }
    .app-mark i {
      display: block;
      border-radius: 2px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 0 7px rgba(255,255,255,.18);
    }
    .title {
      margin: 0;
      color: #fff;
      font-family: var(--heading);
      font-size: 1.65rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 13px rgba(230,0,0,.52);
    }
    .window-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .window-controls i {
      position: relative;
      width: 34px;
      height: 30px;
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 6px;
      background: #0f0f0f;
    }
    .window-controls i::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 9px;
      height: 1px;
      transform: translate(-50%,-50%);
      background: #777;
    }
    .window-controls i:nth-child(2)::after {
      width: 8px;
      height: 7px;
      border: 1px solid #777;
      background: transparent;
    }
    .window-controls i:last-child {
      border-color: rgba(187,0,0,.24);
    }
    .window-controls i:last-child::before,
    .window-controls i:last-child::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 1px;
      background: #a44;
    }
    .window-controls i:last-child::before { transform: translate(-50%,-50%) rotate(45deg); }
    .window-controls i:last-child::after { transform: translate(-50%,-50%) rotate(-45deg); }
    .toolbar {
      height: 58px;
      display: grid;
      grid-template-columns: 42px 42px minmax(140px, 1fr) minmax(120px, 280px);
      gap: 10px;
      align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      background: #090909;
    }
    .tool-button,
    .address,
    .search {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #121212, #0b0b0b);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
    }
    .tool-button {
      position: relative;
    }
    .tool-button::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-left: 2px solid #777;
      border-bottom: 2px solid #777;
      transform: translate(-35%,-50%) rotate(45deg);
    }
    .tool-button:nth-child(2)::before { transform: translate(-65%,-50%) rotate(225deg); }
    .address {
      position: relative;
      overflow: hidden;
      border-color: rgba(187,0,0,.19);
    }
    .address::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 50%;
      width: min(42%, 260px);
      height: 4px;
      border-radius: 999px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(187,0,0,.48), rgba(187,0,0,.08));
      box-shadow: 0 0 10px rgba(187,0,0,.12);
    }
    .search {
      position: relative;
      border-radius: 999px;
    }
    .search::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 11px;
      width: 10px;
      height: 10px;
      border: 1px solid #5d5d5d;
      border-radius: 50%;
    }
    .search::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 23px;
      width: 6px;
      height: 1px;
      transform: rotate(45deg);
      background: #5d5d5d;
    }
    .workspace {
      position: relative;
      min-height: calc(100vh - clamp(1.3rem, 3vw, 2.4rem) - 68px);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(187,0,0,.055), transparent 31rem),
        linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px),
        #050505;
      background-size: auto, 44px 44px, 44px 44px, auto;
    }
    .workspace::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), var(--hot), var(--red), transparent);
      box-shadow: 0 0 16px rgba(230,0,0,.48);
      opacity: .65;
    }
    .ambient {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(48vw, 640px);
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(187,0,0,.035), transparent 68%);
      filter: blur(5px);
    }
    .explorer {
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .titlebar {
      justify-content: center;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    .workspace {
      background:
        radial-gradient(circle at 50% 10%, rgba(187,0,0,.055), transparent 31rem),
        #050505;
    }
    .workspace::before { display: none; }
    .content {
      width: min(1320px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(1rem, 2.5vw, 2rem) 0 4rem;
    }
    .video-card {
      overflow: hidden;
      margin-bottom: clamp(1.2rem, 2.5vw, 2rem);
      border: 1px solid rgba(187,0,0,.34);
      border-radius: 13px;
      background: #000;
      box-shadow: 0 18px 52px rgba(0,0,0,.6), 0 0 28px rgba(187,0,0,.12);
    }
    .video-card video {
      display: block;
      width: 100%;
      max-height: 72vh;
      background: #000;
      object-fit: contain;
    }
    .folders {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
    }
    .folder {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 11px;
      background: rgba(10,10,10,.92);
      box-shadow: 0 12px 32px rgba(0,0,0,.38);
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .folder[open] {
      grid-column: 1 / -1;
      border-color: rgba(230,0,0,.42);
      box-shadow: 0 20px 54px rgba(0,0,0,.58), 0 0 25px rgba(187,0,0,.1);
    }
    .folder summary {
      min-height: 82px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 17px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      background: linear-gradient(135deg, rgba(187,0,0,.1), transparent 52%), #0c0c0c;
    }
    .folder summary::-webkit-details-marker { display: none; }
    .folder-icon {
      position: relative;
      width: 48px;
      height: 35px;
      flex: 0 0 auto;
      border: 1px solid rgba(230,0,0,.48);
      border-radius: 5px;
      background: linear-gradient(145deg, rgba(187,0,0,.7), #300000);
      box-shadow: 0 0 17px rgba(230,0,0,.17), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .folder-icon::before {
      content: "";
      position: absolute;
      left: -1px;
      top: -8px;
      width: 22px;
      height: 9px;
      border: 1px solid rgba(230,0,0,.48);
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      background: #630000;
    }
    .folder-name {
      color: #fff;
      font: 600 1.15rem/1 var(--heading);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(230,0,0,.32);
    }
    .folder-plus {
      margin-left: auto;
      color: #888;
      font-size: 1.35rem;
      transition: transform .25s ease, color .25s ease;
    }
    .folder[open] .folder-plus { color: var(--hot); transform: rotate(45deg); }
    .folder-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      padding: 1rem;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .photo {
      appearance: none;
      position: relative;
      overflow: hidden;
      display: block;
      width: 100%;
      padding: 0;
      cursor: zoom-in;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: #000;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .35s ease, filter .35s ease;
    }
    .photo:hover img { transform: scale(1.018); filter: brightness(1.08); }
    .photo::after {
      content: "⛶";
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 7px;
      color: #fff;
      background: rgba(0,0,0,.72);
      font-size: 1rem;
      opacity: .85;
    }
    .lightbox {
      width: 100vw;
      max-width: none;
      height: 100vh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: rgba(0,0,0,.96);
    }
    .lightbox::backdrop { background: rgba(0,0,0,.95); }
    .lightbox img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .lightbox-control {
      position: fixed;
      top: 14px;
      z-index: 2;
      width: 44px;
      height: 44px;
      cursor: pointer;
      border: 1px solid rgba(230,0,0,.38);
      border-radius: 9px;
      color: #fff;
      background: rgba(15,15,15,.88);
      box-shadow: 0 0 18px rgba(187,0,0,.16);
      font-size: 1.2rem;
    }
    .lightbox-full { right: 68px; }
    .lightbox-close { right: 14px; font-size: 1.65rem; }
    .lightbox:fullscreen { background: #000; }
    @media (max-width: 900px) {
      .folders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 650px) {
      .content { width: min(100% - 1rem, 1320px); }
      .folders { grid-template-columns: 1fr; }
      .folder[open] { grid-column: auto; }
      .folder-content { grid-template-columns: 1fr; }
    }
    @media (max-width: 650px) {
      .desktop { padding: 0; }
      .explorer { min-height: 100vh; border-width: 0; border-radius: 0; }
      .titlebar { height: 62px; padding: 0 13px; }
      .title { font-size: 1.45rem; }
      .toolbar { grid-template-columns: 38px 38px 1fr; padding-inline: 10px; }
      .search { display: none; }
      .window-controls i { width: 27px; }
      .workspace { min-height: calc(100vh - 62px); }
    }
  </style>
</head>

                <img src="../assets/cars/car-12/front.webp" alt="CAR 12 front view" loading="lazy" decoding="async">
              </button>
              <button class="photo" type="button" data-full="../assets/cars/car-12/rear.webp" aria-label="Fullscreen CAR 12 rear view">
                <img src="../assets/cars/car-12/rear.webp" alt="CAR 12 rear view" loading="lazy" decoding="async">
              </button>
            </div>
          </details>
          <details class="folder">
            <summary>
              <span class="folder-icon" aria-hidden="true"></span>
              <span class="folder-name">CAR 13</span>
              <span class="folder-plus" aria-hidden="true">+</span>
            </summary>
            <div class="folder-content">
              <button class="photo" type="button" data-full="../assets/cars/car-13/front.webp" aria-label="Fullscreen CAR 13 front view">
                <img src="../assets/cars/car-13/front.webp" alt="CAR 13 front view" loading="lazy" decoding="async">
              </button>
              <button class="photo" type="button" data-full="../assets/cars/car-13/rear.webp" aria-label="Fullscreen CAR 13 rear view">
                <img src="../assets/cars/car-13/rear.webp" alt="CAR 13 rear view" loading="lazy" decoding="async">
              </button>
            </div>
          </details>
          </div>
        </div>
      </section>
    </main>
  </div>
  <dialog class="lightbox" id="lightbox">
    <button class="lightbox-control lightbox-full" id="lightboxFull" type="button" aria-label="Enter fullscreen">⛶</button>
    <button class="lightbox-control lightbox-close" id="lightboxClose" type="button" aria-label="Close image">×</button>
    <img id="lightboxImage" alt="">
  </dialog>
  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    document.querySelectorAll(".photo").forEach(photo => {
      photo.addEventListener("click", () => {
        lightboxImage.src = photo.dataset.full;
        lightboxImage.alt = photo.querySelector("img").alt;
        lightbox.showModal();
      });
    });
    document.getElementById("lightboxClose").addEventListener("click", async () => {
      if (document.fullscreenElement) await document.exitFullscreen();
      lightbox.close();
      lightboxImage.removeAttribute("src");
    });
    document.getElementById("lightboxFull").addEventListener("click", () => {
      if (!document.fullscreenElement) lightbox.requestFullscreen();
      else document.exitFullscreen();
    });
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) document.getElementById("lightboxClose").click();
    });
  </script>
</body>
</html>
